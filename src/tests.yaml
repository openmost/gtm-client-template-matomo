scenarios:
- name: ignores unrelated paths
  code: |-
    mock('getRequestPath', '/other');
    runCode(mockData);
    assertApi('claimRequest').wasNotCalled();
- name: serves tracker JS from fresh cache
  code: |-
    mock('getRequestPath', '/js/app.js');
    mock('getTimestampMillis', 1000000);
    mockObject('templateDataStorage', {
      getItemCopy: function () { return { body: 'CACHED', ts: 999000 }; },
      setItemCopy: function () { fail('must not write cache'); },
      removeItem: function () {}
    });
    runCode(mockData);
    assertApi('claimRequest').wasCalled();
    assertApi('sendHttpGet').wasNotCalled();
    assertApi('setResponseStatus').wasCalledWith(200);
    assertApi('setResponseHeader').wasCalledWith('Content-Type', 'application/javascript; charset=utf-8');
    assertApi('setResponseHeader').wasCalledWith('Cache-Control', 'public, max-age=43200');
    assertApi('setResponseBody').wasCalledWith('CACHED');
    assertApi('returnResponse').wasCalled();
- name: fetches tracker JS when cache expired and stores it
  code: |-
    let fetchedUrl;
    let stored;
    mock('getRequestPath', '/js/app.js');
    mock('getTimestampMillis', 50000000);
    mockObject('templateDataStorage', {
      getItemCopy: function () { return { body: 'OLD', ts: 0 }; },
      setItemCopy: function (key, value) { stored = value; },
      removeItem: function () {}
    });
    mock('sendHttpGet', function (url, cb, options) { fetchedUrl = url; cb(200, {}, 'FRESH'); });
    runCode(mockData);
    assertThat(fetchedUrl).isEqualTo('https://matomo.example.com/matomo.js');
    assertThat(stored).isEqualTo({ body: 'FRESH', ts: 50000000 });
    assertApi('setResponseBody').wasCalledWith('FRESH');
- name: serves stale tracker JS when instance fails
  code: |-
    mock('getRequestPath', '/js/app.js');
    mock('getTimestampMillis', 50000000);
    mockObject('templateDataStorage', {
      getItemCopy: function () { return { body: 'OLD', ts: 0 }; },
      setItemCopy: function () {},
      removeItem: function () {}
    });
    mock('sendHttpGet', function (url, cb) { cb(500, {}, ''); });
    runCode(mockData);
    assertApi('setResponseBody').wasCalledWith('OLD');
- name: returns 502 when no tracker JS is available
  code: |-
    mock('getRequestPath', '/js/app.js');
    mock('sendHttpGet', function (url, cb) { cb(503, {}, ''); });
    runCode(mockData);
    assertApi('setResponseStatus').wasCalledWith(502);
    assertApi('returnResponse').wasCalled();
- name: answers CORS preflight on tracker path
  code: |-
    mock('getRequestPath', '/collect');
    mock('getRequestMethod', 'OPTIONS');
    mock('getRequestHeader', headers({ origin: 'https://www.example.com' }));
    runCode(mockData);
    assertApi('setResponseStatus').wasCalledWith(204);
    assertApi('setResponseHeader').wasCalledWith('Access-Control-Allow-Origin', 'https://www.example.com');
    assertApi('setResponseHeader').wasCalledWith('Access-Control-Allow-Credentials', 'true');
    assertApi('setResponseHeader').wasCalledWith('Access-Control-Allow-Methods', 'GET, POST, OPTIONS');
    assertApi('runContainer').wasNotCalled();
- name: rejects preflight from an origin that is not allowed
  code: |-
    mock('getRequestPath', '/collect');
    mock('getRequestMethod', 'OPTIONS');
    mock('getRequestHeader', headers({ origin: 'https://evil.example.org' }));
    runCode(withData({ allowedOrigins: 'https://www.example.com, https://shop.example.com' }));
    assertApi('setResponseStatus').wasCalledWith(403);
    assertApi('setResponseHeader').wasNotCalledWith('Access-Control-Allow-Origin', 'https://evil.example.org');
- name: GET hit runs the container once and answers 204
  code: |-
    const events = runTracker('GET', 'idsite=1&rec=1&url=https%3A%2F%2Fwww.example.com%2F&action_name=Home&send_image=0');
    assertThat(events.length).isEqualTo(1);
    assertThat(events[0]['x-matomo-hit'].url).isEqualTo('https://www.example.com/');
    assertThat(events[0]['x-matomo-idsite']).isEqualTo('1');
    assertApi('setResponseStatus').wasCalledWith(204);
    assertApi('setResponseHeader').wasCalledWith('Cache-Control', 'no-store');
    assertApi('returnResponse').wasCalled();
- name: sendBeacon POST with parameters in query and empty body
  code: |-
    const events = runTracker('POST', 'idsite=1&rec=1&action_name=Home', '');
    assertThat(events.length).isEqualTo(1);
    assertThat(events[0]['x-matomo-hit'].action_name).isEqualTo('Home');
- name: POST body is decoded as form urlencoded with UTF8 and plus signs
  code: |-
    const events = runTracker('POST', '', 'idsite=1&rec=1&action_name=Caf%C3%A9+cr%C3%A8me&url=https%3A%2F%2Fx.fr%2F');
    assertThat(events[0]['x-matomo-hit'].action_name).isEqualTo('Café crème');
    assertThat(events[0]['x-matomo-hit'].url).isEqualTo('https://x.fr/');
- name: bulk request runs one container per hit and answers once
  code: |-
    let responses = 0;
    mock('returnResponse', function () { responses = responses + 1; });
    const body = '{"requests":["?idsite=1&rec=1&e_c=a","?idsite=1&rec=1&e_c=b","?idsite=1&rec=1&hsr_vid=abc","?idsite=1&rec=1&e_c=c"],"send_image":0}';
    const events = runTracker('POST', '', body);
    assertThat(events.length).isEqualTo(3);
    assertThat(events[2]['x-matomo-hit'].e_c).isEqualTo('c');
    assertThat(responses).isEqualTo(1);
    assertApi('setResponseStatus').wasCalledWith(204);
- name: token auth sent by a browser is stripped
  code: |-
    const events = runTracker('GET', 'idsite=1&rec=1&token_auth=secret');
    assertThat(events[0]['x-matomo-hit'].token_auth).isUndefined();
- name: repeated keys become arrays
  code: |-
    const events = runTracker('GET', 'idsite=1&rec=1&fa_fp%5B%5D=a&fa_fp%5B%5D=b');
    assertThat(events[0]['x-matomo-hit']['fa_fp[]']).isEqualTo(['a', 'b']);
- name: empty request answers 204 without running the container
  code: |-
    const events = runTracker('POST', '', '');
    assertThat(events.length).isEqualTo(0);
    assertApi('setResponseStatus').wasCalledWith(204);
    assertApi('returnResponse').wasCalled();
- name: hit without idsite is ignored
  code: |-
    const events = runTracker('GET', 'rec=1&url=https%3A%2F%2Fx.fr%2F');
    assertThat(events.length).isEqualTo(0);
    assertApi('setResponseStatus').wasCalledWith(204);
- name: GET with send image 1 returns a pixel
  code: |-
    runTracker('GET', 'idsite=1&rec=1&send_image=1');
    assertApi('setPixelResponse').wasCalled();
    assertApi('setResponseStatus').wasNotCalledWith(204);
- name: hit response carries CORS headers when Origin is present
  code: |-
    mock('getRequestHeader', headers({ origin: 'https://www.example.com' }));
    runTracker('POST', 'idsite=1&rec=1', '');
    assertApi('setResponseHeader').wasCalledWith('Access-Control-Allow-Origin', 'https://www.example.com');
- name: hit from an origin that is not allowed is rejected
  code: |-
    mock('getRequestHeader', headers({ origin: 'https://evil.example.org' }));
    const events = runTracker('POST', 'idsite=1&rec=1', '', { allowedOrigins: 'https://www.example.com' });
    assertThat(events.length).isEqualTo(0);
    assertApi('setResponseStatus').wasCalledWith(403);
- name: maps common pageview fields
  code: |-
    mock('getRemoteAddress', '203.0.113.9');
    const ev = runTracker('GET', 'idsite=3&rec=1&url=https%3A%2F%2Fwww.example.com%2Fp&action_name=Page&urlref=https%3A%2F%2Fgoogle.com%2F&_id=0123456789abcdef&uid=u42&res=1920x1080&lang=fr-FR&ua=UA-X')[0];
    assertThat(ev.event_name).isEqualTo('page_view');
    assertThat(ev.page_location).isEqualTo('https://www.example.com/p');
    assertThat(ev.page_title).isEqualTo('Page');
    assertThat(ev.page_referrer).isEqualTo('https://google.com/');
    assertThat(ev.client_id).isEqualTo('0123456789abcdef');
    assertThat(ev.user_id).isEqualTo('u42');
    assertThat(ev.ip_override).isEqualTo('203.0.113.9');
    assertThat(ev.user_agent).isEqualTo('UA-X');
    assertThat(ev.language).isEqualTo('fr-FR');
    assertThat(ev.screen_resolution).isEqualTo('1920x1080');
    assertThat(ev['x-matomo-idsite']).isEqualTo('3');
- name: user agent and language fall back to request headers
  code: |-
    mock('getRequestHeader', headers({ 'user-agent': 'Mozilla/5.0', 'accept-language': 'fr-FR,fr;q=0.9,en;q=0.8' }));
    const ev = runTracker('GET', 'idsite=1&rec=1')[0];
    assertThat(ev.user_agent).isEqualTo('Mozilla/5.0');
    assertThat(ev.language).isEqualTo('fr-FR');
    assertThat(ev.client_id).isEqualTo('');
- name: collects request context headers and ignore cookie
  code: |-
    mock('getRequestHeader', headers({ referer: 'https://www.example.com/p', dnt: '1', 'sec-ch-ua': '"Chromium";v="128"' }));
    mock('getCookieValues', function (name) { return name === 'matomo_ignore' ? ['*'] : []; });
    const ev = runTracker('GET', 'idsite=1&rec=1')[0];
    assertThat(ev['x-matomo-request']).isEqualTo({ referer: 'https://www.example.com/p', dnt: '1', 'sec-ch-ua': '"Chromium";v="128"', ignore_cookie: '*' });
- name: maps every hit type to its event name
  code: |-
    const cases = [
      ['fa_id=f1&fa_ef=1', 'matomo_form'],
      ['ma_id=m1&ma_mt=video', 'matomo_media'],
      ['cra=Error&cra_st=x', 'matomo_crash'],
      ['ping=1', 'matomo_ping'],
      ['idgoal=0&ec_id=T1&revenue=10', 'purchase'],
      ['idgoal=0&revenue=10', 'update_cart'],
      ['idgoal=4', 'matomo_goal'],
      ['search=shoes&search_cat=cat&search_count=12', 'view_search_results'],
      ['e_c=abtesting&e_a=exp1&e_n=original', 'matomo_abtesting'],
      ['e_c=Video&e_a=Play&e_n=intro&e_v=3', 'matomo_event'],
      ['c_n=Banner&c_p=img.png&c_t=%2Fpromo', 'matomo_content'],
      ['download=https%3A%2F%2Fx.fr%2Ff.pdf', 'file_download'],
      ['link=https%3A%2F%2Fother.com%2F', 'click'],
      ['_pks=SKU1&_pkn=Shoe&_pkc=Shoes&_pkp=59.9', 'page_view'],
      ['action_name=Home', 'page_view']
    ];
    cases.forEach(function (c) {
      assertThat(runTracker('GET', 'idsite=1&rec=1&' + c[0])[0].event_name, c[0]).isEqualTo(c[1]);
    });
- name: maps ecommerce order fields and items
  code: |-
    const items = encodeUriComponent('[["SKU1","Shoe",["Shoes","Men"],59.95,2]]');
    const ev = runTracker('GET', 'idsite=1&rec=1&idgoal=0&ec_id=T1&revenue=129.9&ec_tx=20&ec_sh=10&ec_dt=5&ec_items=' + items)[0];
    assertThat(ev.transaction_id).isEqualTo('T1');
    assertThat(ev.value).isEqualTo(129.9);
    assertThat(ev.tax).isEqualTo(20);
    assertThat(ev.shipping).isEqualTo(10);
    assertThat(ev.discount).isEqualTo(5);
    assertThat(ev.items).isEqualTo([{ item_id: 'SKU1', item_name: 'Shoe', item_category: 'Shoes', item_category2: 'Men', price: 59.95, quantity: 2 }]);
- name: maps event fields
  code: |-
    const ev = runTracker('GET', 'idsite=1&rec=1&e_c=Video&e_a=Play&e_n=intro&e_v=3')[0];
    assertThat(ev.event_category).isEqualTo('Video');
    assertThat(ev.event_action).isEqualTo('Play');
    assertThat(ev.event_label).isEqualTo('intro');
    assertThat(ev.value).isEqualTo(3);
- name: maps product view to items
  code: |-
    const ev = runTracker('GET', 'idsite=1&rec=1&_pks=SKU1&_pkn=Shoe&_pkc=' + encodeUriComponent('["Shoes","Men"]') + '&_pkp=59.9')[0];
    assertThat(ev.items).isEqualTo([{ item_id: 'SKU1', item_name: 'Shoe', item_category: 'Shoes', item_category2: 'Men', price: 59.9 }]);
- name: maps site search fields
  code: |-
    const ev = runTracker('GET', 'idsite=1&rec=1&search=shoes&search_cat=cat&search_count=12')[0];
    assertThat(ev.search_term).isEqualTo('shoes');
    assertThat(ev.search_category).isEqualTo('cat');
    assertThat(ev.search_count).isEqualTo(12);
- name: omits keys that have no value
  code: |-
    const ev = runTracker('GET', 'idsite=1&rec=1')[0];
    assertThat(Object.keys(ev).indexOf('user_id')).isEqualTo(-1);
    assertThat(Object.keys(ev).indexOf('page_title')).isEqualTo(-1);
- name: proxies AB testing redirect when enabled
  code: |-
    let requested;
    mock('getRequestPath', '/plugins/AbTesting/redirect.php');
    mock('getRequestQueryString', 'id=3');
    mock('sendHttpGet', function (url, cb) { requested = url; cb(302, { location: 'https://www.example.com/variant' }, ''); });
    runCode(withData({ proxyAbTesting: true }));
    assertThat(requested).isEqualTo('https://matomo.example.com/plugins/AbTesting/redirect.php?id=3');
    assertApi('setResponseStatus').wasCalledWith(302);
    assertApi('setResponseHeader').wasCalledWith('Location', 'https://www.example.com/variant');
- name: does not claim AB testing redirect when disabled
  code: |-
    mock('getRequestPath', '/plugins/AbTesting/redirect.php');
    runCode(mockData);
    assertApi('claimRequest').wasNotCalled();
setup: |-
  const encodeUriComponent = require('encodeUriComponent');
  const Object = require('Object');
  const mockData = {
    matomoUrl: 'https://matomo.example.com/',
    jsPath: '/js/app.js',
    trackerPath: '/collect',
    jsCacheHours: '12',
    allowedOrigins: '',
    proxyAbTesting: false
  };
  function withData(extra) {
    const d = {};
    Object.keys(mockData).forEach(function (k) { d[k] = mockData[k]; });
    Object.keys(extra || {}).forEach(function (k) { d[k] = extra[k]; });
    return d;
  }
  function headers(map) {
    return function (name) { return map[name]; };
  }
  function runTracker(method, query, body, extra) {
    const events = [];
    mock('getRequestPath', '/collect');
    mock('getRequestMethod', method);
    mock('getRequestQueryString', query || '');
    mock('getRequestBody', body || '');
    mock('runContainer', function (event, onComplete) { events.push(event); onComplete(); });
    runCode(withData(extra));
    return events;
  }
